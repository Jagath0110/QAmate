databases:
  - name: qamate-db
    plan: basic
    region: singapore

services:
  - type: web
    name: qamate
    runtime: node
    region: singapore
    plan: starter
    branch: feat/qamate-app
    buildCommand: npm install && npm run build
    preDeployCommand: npx prisma db push
    startCommand: npm run start
    healthCheckPath: /qa
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qamate-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: SYNC_STALE_WARN_MINUTES
        value: "15"
      - key: SYNC_STALE_ERROR_MINUTES
        value: "60"
      - key: GITHUB_REPO
        value: oraxs/oraxs-platform
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: QA_SHEET_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SYNC_WEBHOOK_SECRET
        sync: false
      - key: SHARE_TOKEN_SECRET
        sync: false

  - type: cron
    name: qamate-sync
    runtime: node
    region: singapore
    plan: starter
    branch: feat/qamate-app
    schedule: "*/10 * * * *"
    buildCommand: "true"
    startCommand: >
      curl -fsS -X POST
      -H "X-QA-Sync-Secret: $SYNC_WEBHOOK_SECRET"
      "https://qamate.onrender.com/api/sync/run?trigger=cron"
    envVars:
      - key: SYNC_WEBHOOK_SECRET
        sync: false
